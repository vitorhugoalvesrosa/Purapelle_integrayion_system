{% load static %}
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PuraPelle | Alterar senha</title>
  <link rel="stylesheet" href="{% static 'clinic/styles.css' %}">
</head>
<body class="login-page">
  <main class="login-card">
    <a class="brand login-brand" href="/" aria-label="PuraPelle">
      <span class="brand-mark">P</span>
      <span><strong>pura<span>pelle</span></strong><small>INTEGRATION SYSTEM</small></span>
    </a>
    <p class="eyebrow">SEGURANÇA DA CONTA</p>
    <h1>Alterar senha</h1>
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
        <label class="field">{{ field.label }}{{ field }}{% if field.errors %}<span class="login-error">{{ field.errors|join:", " }}</span>{% endif %}</label>
      {% endfor %}
      <button class="button button-dark" type="submit">Salvar nova senha</button>
      <a class="admin-link" href="/">Voltar ao painel</a>
    </form>
  </main>
</body>
</html>
