{% load static %}
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5f1">
  <title>PuraPelle | Acesso</title>
  <link rel="stylesheet" href="{% static 'clinic/styles.css' %}">
</head>
<body class="login-page">
  <main class="login-card">
    <a class="brand login-brand" href="/" aria-label="PuraPelle">
      <span class="brand-mark">P</span>
      <span><strong>pura<span>pelle</span></strong><small>INTEGRATION SYSTEM</small></span>
    </a>
    <p class="eyebrow">ACESSO À CLÍNICA</p>
    <h1>Bem-vinda de volta</h1>
    {% if form.errors %}
      <p class="login-error" role="alert">Usuário ou senha incorretos. Tente novamente.</p>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <label class="field">Usuário<input name="username" autocomplete="username" required autofocus></label>
      <label class="field">Senha<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="button button-dark" type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
